name: CI/CD Pipeline & Azure Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'chirp-rg' }}
  AZURE_CONTAINER_APP_ENV: ${{ secrets.AZURE_CONTAINER_APP_ENV || 'chirp-aca-env' }}
  ACR_NAME: ${{ secrets.ACR_NAME }}

jobs:
  validate:
    name: Lint, Test & Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0
        with:
          version: '2.5.0'

      - name: Install JavaScript Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python API Dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate Proto TypeScript Stubs
        run: pnpm --filter @chirp/proto run proto:generate

      - name: Generate Route Trees
        run: pnpm run generate:routes

      - name: Linting (Fail-Fast)
        run: moon ci :lint --summary detailed

      - name: Typecheck (Fail-Fast)
        run: moon ci :typecheck --summary detailed

      - name: Unit Tests (Fail-Fast)
        run: moon ci :test --summary detailed

      - name: Build (Fail-Fast)
        run: moon ci :build --summary detailed

  deploy:
    name: Build Docker Images & Deploy to Azure
    needs: [validate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-api:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push User Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client-user/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-user:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-user:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Admin Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client-admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-admin:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retrieve ACR Credentials
        id: acr-credentials
        run: |
          az acr update --name ${{ secrets.ACR_NAME }} --admin-enabled true
          ACR_USERNAME=$(az acr credential show --name ${{ secrets.ACR_NAME }} --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ secrets.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "::add-mask::$ACR_PASSWORD"
          echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy API to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ steps.acr-credentials.outputs.username }}
          acrPassword: ${{ steps.acr-credentials.outputs.password }}
          containerAppName: chirp-api
          containerAppEnvironment: ${{ env.AZURE_CONTAINER_APP_ENV }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/chirp-api:${{ github.sha }}
          targetPort: 50051
          ingress: internal

      - name: Deploy Client User to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ steps.acr-credentials.outputs.username }}
          acrPassword: ${{ steps.acr-credentials.outputs.password }}
          containerAppName: chirp-client-user
          containerAppEnvironment: ${{ env.AZURE_CONTAINER_APP_ENV }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-user:${{ github.sha }}
          targetPort: 3000
          ingress: external

      - name: Deploy Client Admin to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          acrUsername: ${{ steps.acr-credentials.outputs.username }}
          acrPassword: ${{ steps.acr-credentials.outputs.password }}
          containerAppName: chirp-client-admin
          containerAppEnvironment: ${{ env.AZURE_CONTAINER_APP_ENV }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/chirp-client-admin:${{ github.sha }}
          targetPort: 3002
          ingress: external
