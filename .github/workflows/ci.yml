name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install moon
        uses: moonrepo/setup-toolchain@v0
        with:
          version: '2.5.0'

      - name: Install JavaScript Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python API Dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate Route Trees
        run: pnpm run generate:routes

      - name: Linting (Fail-Fast)
        run: moon ci :lint --summary detailed

      - name: Typecheck (Fail-Fast)
        run: moon ci :typecheck --summary detailed

      - name: Unit Tests (Fail-Fast)
        run: moon ci :test --summary detailed

      - name: Build (Fail-Fast)
        run: moon ci :build --summary detailed
